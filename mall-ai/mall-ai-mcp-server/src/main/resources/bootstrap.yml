# Tomcat
server:
  port: 9995

# Spring
spring:
  main:
    banner-mode: off
  application:
    # 应用名称
    name: mall-ai-mcp-server
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 114.132.102.8:8848
      config:
        # 配置中心地址
        server-addr: 114.132.102.8:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
